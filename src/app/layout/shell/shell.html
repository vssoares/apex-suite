<main class="app-window" data-purpose="app-main-window">
  <app-titlebar />

  @if (update.status() === 'available' && update.pendingVersion(); as version) {
    <div class="update-bar">
      <span>Nova versão disponível: v{{ version }}</span>
      <button type="button" (click)="installUpdate()">Atualizar</button>
    </div>
  } @else if (update.status() === 'downloading') {
    <div class="update-bar muted">
      <app-status-dot tone="warning" />
      <span class="mono">Baixando atualização {{ update.progress() }}%</span>
    </div>
  }

  <div class="workspace">
    <router-outlet />
  </div>
</main>
