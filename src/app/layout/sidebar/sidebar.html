<aside
  class="fixed left-0 top-0 z-50 flex h-full w-64 flex-col border-r border-outline-variant bg-surface-container-low"
>
  <div class="flex h-12 items-center gap-2.5 border-b border-outline-variant bg-surface px-4">
    <img src="logo.png" alt="Apex Color +" class="h-7 w-7 object-contain" />
    <span class="text-sm font-semibold tracking-wide text-on-surface">Apex Color +</span>
  </div>

  <div class="px-4 pb-2 pt-4">
    <span class="text-[11px] font-medium uppercase tracking-wider text-on-surface-variant">
      Menu Principal
    </span>
  </div>

  <nav class="flex flex-col gap-1 px-3">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-surface-container-high text-on-surface font-medium border border-outline/30"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-lg px-3 py-2 text-xs text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface"
      >
        <app-icon [name]="item.icon" [size]="18" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
