<header
  class="fixed left-64 right-0 top-0 z-40 flex h-12 items-center justify-between border-b border-outline-variant bg-surface px-4"
  style="-webkit-app-region: drag"
>
  <div class="flex items-center gap-3" style="-webkit-app-region: no-drag">
    <div
      class="flex items-center gap-1.5 rounded bg-surface-container px-2.5 py-1 text-xs border border-outline-variant"
    >
      <app-status-dot tone="success" />
      <span class="font-medium text-on-surface">Boost: Ativo</span>
    </div>

    @if (update.status() === 'available' && update.pendingVersion(); as version) {
      <button
        type="button"
        class="flex items-center gap-1.5 rounded border border-primary/40 bg-primary/10 px-2.5 py-1 text-xs text-primary transition-colors hover:bg-primary/20"
        (click)="installUpdate()"
      >
        <app-icon name="system_update_alt" [size]="14" color="primary" />
        <span>Atualizar para v{{ version }}</span>
      </button>
    } @else if (update.status() === 'downloading') {
      <div
        class="flex items-center gap-1.5 rounded border border-outline-variant bg-surface-container px-2.5 py-1 text-xs text-on-surface-variant"
      >
        <app-status-dot tone="warning" />
        <span class="font-mono">Baixando {{ update.progress() }}%</span>
      </div>
    } @else if (update.status() === 'error') {
      <button
        type="button"
        class="flex items-center gap-1.5 rounded border border-error/40 bg-error/10 px-2.5 py-1 text-xs text-error"
        (click)="update.dismiss()"
      >
        <span>{{ update.error() || 'Erro na atualização' }}</span>
      </button>
    }
  </div>

  <div class="flex items-center gap-2" style="-webkit-app-region: no-drag">
    <div
      class="grid h-7 w-7 place-items-center rounded-full border border-outline-variant bg-surface-container-high"
    >
      <app-icon name="person" [size]="16" color="muted" />
    </div>
    <div class="ml-1 flex h-7 items-center border-l border-outline-variant pl-2">
      <button
        type="button"
        class="grid h-7 w-7 place-items-center rounded text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface"
        (click)="minimize()"
        aria-label="Minimizar"
      >
        <app-icon name="minimize" [size]="15" color="muted" />
      </button>
      <button
        type="button"
        class="grid h-7 w-7 place-items-center rounded text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface"
        (click)="maximize()"
        aria-label="Maximizar"
      >
        <app-icon name="crop_square" [size]="15" color="muted" />
      </button>
      <button
        type="button"
        class="grid h-7 w-7 place-items-center rounded text-on-surface-variant transition-colors hover:bg-surface-container hover:text-error"
        (click)="close()"
        aria-label="Fechar"
      >
        <app-icon name="close" [size]="15" color="muted" />
      </button>
    </div>
  </div>
</header>
