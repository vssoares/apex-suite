<div class="page">
  <header class="header">
    <div>
      <p class="eyebrow">Sistema</p>
      <h1>Configurações</h1>
      <p class="sub">Preferências do aplicativo e integração com o Windows.</p>
    </div>
    <div class="brand">
      <img src="logo.png" alt="Apex Suite" width="40" height="40" />
      <div>
        <span class="name">Apex Suite</span>
        <span class="ver mono">v{{ appVersion() }}</span>
      </div>
    </div>
  </header>

  <app-panel>
    <div class="section-head">
      <div class="title">
        <app-icon name="desktop_windows" [size]="18" color="sky" />
        <h2>Inicialização</h2>
      </div>
    </div>

    <div class="row">
      <div class="copy">
        <div class="row-title">
          <app-icon name="power_settings_new" [size]="16" color="muted" />
          <span>Iniciar com o Windows</span>
        </div>
        <p>
          Abre o Apex Suite automaticamente ao ligar o PC, direto na bandeja do sistema
          (segundo plano).
        </p>
      </div>
      <app-toggle
        [checked]="openAtLogin()"
        [class.disabled]="!openAtLoginAvailable()"
        (checkedChange)="onOpenAtLoginChange($event)"
      />
    </div>

    @if (status()) {
      <p class="status mono">{{ status() }}</p>
    }
  </app-panel>
</div>
