<app-panel>
  <div class="head">
    <div class="title">
      <app-icon name="tune" [size]="18" color="sky" />
      <h2>Gama & Canais RGB Cromáticos</h2>
    </div>
    <span class="tag">Hardware LUT Calibrated</span>
  </div>

  <div class="stack">
    <div class="gamma-box">
      <div class="gamma-head">
        <span>Curva de Gama Alvo</span>
        <span class="mono">{{ settings().gamma.toFixed(1) }}</span>
      </div>
      <div class="gamma-grid">
        @for (g of gammas; track g) {
          <button
            type="button"
            class="gamma-btn mono"
            [class.active]="settings().gamma === g"
            (click)="setGamma(g)"
          >
            {{ g.toFixed(1) }}
          </button>
        }
      </div>
    </div>

    <app-slider
      label="Temperatura de Cor (Kelvin)"
      [value]="settings().kelvin"
      [defaultValue]="defaults.kelvin"
      [min]="4500"
      [max]="9500"
      [step]="50"
      [formatter]="kelvinFmt"
      [hints]="['4500K (Quente)', '6500K (D65 Neutro)', '9500K (Frio)']"
      (valueChange)="setKelvin($event)"
      (reset)="reset('kelvin')"
    />

    <div class="rgb">
      <div class="channel">
        <div class="ch-head">
          <span class="mono">Canal R</span>
          <span class="mono">{{ settings().channelR }}%</span>
        </div>
        <input
          type="range"
          min="50"
          max="150"
          [value]="settings().channelR"
          (input)="onChannel('channelR', $event)"
        />
      </div>
      <div class="channel">
        <div class="ch-head">
          <span class="mono">Canal G</span>
          <span class="mono">{{ settings().channelG }}%</span>
        </div>
        <input
          type="range"
          min="50"
          max="150"
          [value]="settings().channelG"
          (input)="onChannel('channelG', $event)"
        />
      </div>
      <div class="channel">
        <div class="ch-head">
          <span class="mono">Canal B</span>
          <span class="mono">{{ settings().channelB }}%</span>
        </div>
        <input
          type="range"
          min="50"
          max="150"
          [value]="settings().channelB"
          (input)="onChannel('channelB', $event)"
        />
      </div>
    </div>
  </div>
</app-panel>
