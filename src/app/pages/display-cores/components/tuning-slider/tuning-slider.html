<app-panel>
  <div class="head">
    <div class="title">
      <app-icon name="tune" [size]="18" color="sky" />
      <h2>Ajuste Fino de Imagem</h2>
    </div>
    <span class="tag">DSP v4 Core</span>
  </div>

  <div class="sliders">
    <app-slider
      label="Brilho do Painel"
      icon="brightness_6"
      [value]="settings().brightness"
      [defaultValue]="defaults.brightness"
      [hints]="['0% Escuro', '50% SDR STD', '100% Máximo']"
      (valueChange)="setBrightness($event)"
      (reset)="reset('brightness')"
    />
    <app-slider
      label="Contraste Dinâmico"
      icon="contrast"
      [value]="settings().contrast"
      [defaultValue]="defaults.contrast"
      [hints]="['0% Suave', '50% Neutro', '100% Agudo']"
      (valueChange)="setContrast($event)"
      (reset)="reset('contrast')"
    />
    <app-slider
      label="Black Equalizer (Visibilidade em Sombras)"
      icon="hdr_strong"
      iconColor="sky"
      tag="Competitivo"
      [value]="settings().blackEq"
      [defaultValue]="defaults.blackEq"
      [max]="20"
      [formatter]="blackEqFmt"
      [hints]="['0 Naturais', '10 Equilibrado', '20 Máx. Deteção']"
      (valueChange)="setBlackEq($event)"
      (reset)="reset('blackEq')"
    />
    <app-slider
      label="Saturação Digital (Digital Vibrance)"
      icon="palette"
      [value]="settings().vibrance"
      [defaultValue]="defaults.vibrance"
      [min]="-50"
      [max]="50"
      [formatter]="vibranceFmt"
      [hints]="['-50% P&B', '0% Neutro', '+50% Vívido']"
      (valueChange)="setVibrance($event)"
      (reset)="reset('vibrance')"
    />
    <app-slider
      label="Nitidez & Clareza Adaptativa"
      icon="filter_hdr"
      [value]="settings().sharpness"
      [defaultValue]="defaults.sharpness"
      [hints]="['0% Neutro', '50% Balanceado', '100% Alta Definição']"
      (valueChange)="setSharpness($event)"
      (reset)="reset('sharpness')"
    />
  </div>
</app-panel>
