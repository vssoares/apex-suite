<div class="footer">
  <div class="info">
    <div class="dest">
      <app-icon name="save" [size]="18" color="sky" />
      <div>
        <span class="label">Destino de Gravação</span>
        <span class="value">Perfil: FPS Competitivo / Black EQ (Display 1)</span>
      </div>
    </div>
    <div class="sync">
      <app-status-dot tone="success" />
      <span class="mono">
        Auto-Sync: <strong>Counter-Strike 2</strong>
      </span>
    </div>
  </div>
  <div class="actions">
    <app-button variant="danger" icon="device_reset">Restaurar Padrões Windows</app-button>
    <app-button variant="secondary" icon="sync_alt">Sincronizar com Jogo</app-button>
    <app-button variant="primary" icon="check_circle">Salvar no Perfil Ativo</app-button>
  </div>
</div>
