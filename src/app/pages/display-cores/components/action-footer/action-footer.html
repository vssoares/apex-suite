<div class="footer">
  <div class="info">
    <div class="dest">
      <app-icon name="save" [size]="18" color="sky" />
      <div>
        <span class="label">Destino de Gravação</span>
        <span class="value">{{ profileLabel() }}</span>
      </div>
    </div>
    <div class="sync">
      <app-status-dot [tone]="applying() ? 'warning' : 'success'" />
      <span class="mono">{{ status() }}</span>
    </div>
  </div>
  <div class="actions">
    <app-button variant="danger" icon="device_reset" (click)="resetWindows.emit()">
      Restaurar Padrões Windows
    </app-button>
    <app-button variant="secondary" icon="add" (click)="saveAsProfile.emit()">
      Salvar como perfil
    </app-button>
    @if (canUpdateProfile()) {
      <app-button variant="secondary" icon="edit" (click)="updateProfile.emit()">
        Atualizar perfil
      </app-button>
    }
    <app-button variant="primary" icon="check_circle" (click)="applyProfile.emit()">
      Aplicar no Display
    </app-button>
  </div>
</div>
