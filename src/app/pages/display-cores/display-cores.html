<div class="page">
  <app-dc-page-header />

  @if (overrideActive() && activeGameTitle(); as title) {
    <div class="override-banner mono">
      Override de jogo ativo: {{ title }} — ajustes nesta página salvam as cores gerais.
    </div>
  }

  <div class="top-row">
    <div class="displays">
      <app-display-switcher
        [displays]="displays()"
        (selectDisplay)="onSelectDisplay($event)"
      />
    </div>
    <div class="specs">
      <app-spec-strip [specs]="specs()" />
    </div>
  </div>

  <section class="profiles">
    <div class="profiles-head">
      <span>Perfis de Cor</span>
      <div class="profile-tools">
        <app-button variant="ghost" icon="upload_file" (click)="onImport()">Importar</app-button>
        <app-button variant="ghost" icon="download" (click)="onExport()">Exportar</app-button>
        <app-button variant="secondary" icon="add" (click)="onSaveAsProfile()">Novo</app-button>
        <span class="mono">{{ status() }}</span>
      </div>
    </div>

    @if (showCreateForm()) {
      <div class="create-form">
        <input
          type="text"
          placeholder="Nome do perfil"
          [value]="newProfileTitle()"
          (input)="newProfileTitle.set($any($event.target).value)"
        />
        <input
          type="text"
          placeholder="Descrição (opcional)"
          [value]="newProfileDescription()"
          (input)="newProfileDescription.set($any($event.target).value)"
        />
        <app-button variant="primary" icon="save" (click)="onConfirmCreate()">Salvar</app-button>
        <app-button variant="ghost" (click)="onCancelCreate()">Cancelar</app-button>
      </div>
    }

    <div class="profiles-grid">
      @for (preset of presets(); track preset.id) {
        <app-profile-card
          [title]="preset.title"
          [description]="preset.description"
          [icon]="preset.icon"
          [code]="preset.code"
          [leftLabel]="preset.leftLabel"
          [leftValue]="preset.leftValue"
          [rightLabel]="preset.rightLabel"
          [rightValue]="preset.rightValue"
          [rightTone]="preset.rightTone ?? 'default'"
          [active]="activeProfileId() === preset.id"
          [builtin]="isBuiltin(preset.id)"
          (select)="onSelectPreset(preset.id)"
          (edit)="onEditProfile(preset.id)"
          (remove)="onDeleteProfile(preset.id)"
        />
      }
    </div>
  </section>

  <div class="console">
    <div class="left">
      <app-tuning-slider-panel />
      <app-gamma-panel />
    </div>
    <div class="right">
      <app-preview-panel />
    </div>
  </div>

  <app-action-footer
    [profileLabel]="activeProfileLabel()"
    [status]="status()"
    [applying]="applying()"
    [canUpdateProfile]="canUpdateProfile()"
    (resetWindows)="onResetWindows()"
    (applyProfile)="onApply()"
    (saveAsProfile)="onSaveAsProfile()"
    (updateProfile)="onUpdateProfile()"
  />
</div>
