<div class="page">
  <app-dc-page-header />

  <div class="top-row">
    <div class="displays">
      <app-display-switcher [displays]="displays" />
    </div>
    <div class="specs">
      <app-spec-strip [specs]="specs" />
    </div>
  </div>

  <section class="profiles">
    <div class="profiles-head">
      <span>Predefinições Rápidas de Perfil</span>
      <span class="mono">Atalho Rápido: Ctrl + Alt + F1..F4</span>
    </div>
    <div class="profiles-grid">
      <app-profile-card
        title="FPS Competitivo / Black EQ"
        description="Realce equilibrado de sombras, redução de desfoque e contraste dinâmico para visibilidade máxima de alvos."
        icon="verified"
        active
        leftLabel="Black EQ"
        leftValue="Nv. 12"
        rightLabel="Vibrance"
        rightValue="+22%"
        rightTone="primary"
      />
      <app-profile-card
        title="Vibrante Cyber / RPG"
        description="Cores ricas, gama 2.4 profundo e nitidez adaptativa para ambientação detalhada e imersão visual."
        icon="sports_esports"
        code="P-02"
        leftLabel="Gama"
        leftValue="2.4"
        rightLabel="Saturação"
        rightValue="+40%"
      />
      <app-profile-card
        title="Cinema HDR / Criativo"
        description="Precisão cromática balanceada sRGB/DCI-P3 100%, temperatura D65 6500K para filmes e produtividade."
        icon="movie"
        code="P-03"
        leftLabel="Temp"
        leftValue="6500K"
        rightLabel="DCI-P3"
        rightValue="100%"
      />
      <app-profile-card
        title="Modo Noturno / Anti-Fadiga"
        description="Atenuação de espectro azul em 55%, luminância reduzida para mínimo estresse ocular em sessões noturnas."
        icon="bedtime"
        code="P-04"
        leftLabel="Luz Azul"
        leftValue="-55%"
        rightLabel="Brilho"
        rightValue="32%"
      />
    </div>
  </section>

  <div class="console">
    <div class="left">
      <app-tuning-slider-panel />
      <app-gamma-panel />
    </div>
    <div class="right">
      <app-preview-panel />
    </div>
  </div>

  <app-action-footer />
</div>
