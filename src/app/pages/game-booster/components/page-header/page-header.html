<div class="header">
  <div class="intro">
    <div class="badges">
      <app-badge tone="primary">Apex Engine v4.8</app-badge>
      <app-badge tone="success">Monitoramento Ativo</app-badge>
    </div>
    <h1>{{ title() }}</h1>
    <p>{{ description() }}</p>
  </div>

  <div class="telemetry">
    <app-metric label="CPU Uso" [value]="cpuUsage()" unit="%" tone="success" />
    <app-metric label="CPU Freq" [value]="cpuSpeed()" unit="GHz" />
    <app-metric
      label="Processos Idle"
      [value]="processesIdle()"
      [unit]="'/ ' + processesTotal()"
    />
  </div>
</div>
